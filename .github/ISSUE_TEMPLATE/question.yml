name: ❓ Question
description: Something is unclear and the docs did not answer it.
title: '[q]: '
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        Open-ended conversation belongs in
        [Discussions](https://github.com/Ayaan2907/hackathon-agent-harness/discussions).
        Use this for a specific question with a specific answer.

  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What docs, issues, or code did you read first?

  - type: textarea
    id: links
    attributes:
      label: Relevant links
